services:
  postgres:
    image: postgres:16-alpine
    container_name: freecall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: freecall
      POSTGRES_USER: freecall
      POSTGRES_PASSWORD: freecall_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freecall -d freecall"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: freecall-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: freecall-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0 --keys "devkey: devsecreetdevsecreetdevsecreetdevsecreet"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7880/ || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: freecall-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Create the evidence bucket on first boot.
  minio-init:
    image: minio/mc:latest
    container_name: freecall-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin_dev &&
        mc mb --ignore-existing local/freecall-evidence &&
        mc anonymous set none local/freecall-evidence &&
        echo 'MinIO bucket ready'
      "
    restart: no

  mailhog:
    image: mailhog/mailhog:latest
    container_name: freecall-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Mock moderation provider (simple HTTP echo server for local dev).
  mock-moderation:
    image: node:24-alpine
    container_name: freecall-mock-moderation
    working_dir: /app
    volumes:
      - ./mock-providers:/app
    command: node moderation-server.js
    ports:
      - "9100:9100"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
